<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LeetTarget options</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 24px auto; color: #0f172a; }
      h1 { font-size: 16px; }
      fieldset { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; }
      label { display: block; margin: 8px 0 4px; font-size: 12px; color: #475569; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
      button { margin-top: 12px; padding: 8px 14px; background: #0f172a; color: white; border: none; border-radius: 4px; cursor: pointer; }
      #status { margin-top: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>LeetTarget — options</h1>

    <fieldset>
      <legend>GitHub (LeetHub-style commits)</legend>
      <label for="githubOwner">Owner</label>
      <input id="githubOwner" placeholder="octocat" />
      <label for="githubRepo">Repo</label>
      <input id="githubRepo" placeholder="leetcode-solutions" />
      <label for="githubBranch">Branch</label>
      <input id="githubBranch" placeholder="main" />
      <label for="pathTemplate">Path template</label>
      <input id="pathTemplate" placeholder="{difficulty}/{slug}" />
      <label for="githubToken">Personal access token (repo scope)</label>
      <input id="githubToken" type="password" placeholder="ghp_..." />
    </fieldset>

    <fieldset>
      <legend>LeetTarget sync (optional)</legend>
      <label for="supabaseUrl">Supabase URL</label>
      <input id="supabaseUrl" placeholder="https://your-project.supabase.co" />
      <label for="supabaseAnonKey">Supabase anon key</label>
      <input id="supabaseAnonKey" type="password" />
      <label for="leetTargetUserId">LeetTarget user id</label>
      <input id="leetTargetUserId" />
      <label for="supabaseAccessToken">Access token (from the site's "Extension setup" page)</label>
      <input id="supabaseAccessToken" type="password" />
    </fieldset>

    <button id="save">Save</button>
    <div id="status"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
